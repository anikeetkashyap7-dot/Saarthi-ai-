<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1428">
<title>SAARTHI AI</title>
<style>
:root{--bg:#0a1428;--panel:#12203d;--line:#223458;--text:#e8eefc;--mute:#94a3c4;--cy:#22d3ee;--bl:#3b82f6;--err:#fb7185}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,"Noto Sans Devanagari","Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:auto}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.3px}
header small{display:block;color:var(--mute);font-size:12px;font-weight:400}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 12px}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.tog[aria-pressed=true]{border-color:var(--cy);color:var(--cy)}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:linear-gradient(135deg,var(--bl),#0891b2);color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.err{align-self:flex-start;border:1px solid var(--err);color:var(--err);background:transparent}
.err button{margin-left:8px;padding:4px 10px;color:var(--text)}
.dots{color:var(--mute)}
#start{margin:auto 0;text-align:center;color:var(--mute)}
#start h2{color:var(--text);font-size:22px;margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
form{display:flex;gap:8px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
textarea{flex:1;resize:none;max-height:140px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
#send{background:var(--cy);color:#04202a;border:0;font-weight:600;padding:0 18px}
#send:disabled{opacity:.5;cursor:default}
.note{font-size:12px;color:var(--mute);text-align:center;padding:0 14px 6px}
</style>
</head>
<body>
<header>
  <h1>SAARTHI AI<small>Less confusion. More clarity. Real solutions.</small></h1>
  <button class="tog" id="mode" aria-pressed="false" title="Get step-by-step solutions">Solution mode</button>
  <button id="new">New chat</button>
</header>
<main id="log" aria-live="polite"></main>
<div class="note">Free to use. AI can make mistakes; check important facts. Chats are saved only on this device.</div>
<form id="f">
  <textarea id="t" rows="1" placeholder="अपना सवाल लिखें / Type your question" aria-label="Message"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), t = $("t"), send = $("send"), modeBtn = $("mode");
const KEY = "saarthi.chat.v1";
let msgs = [], solution = false, busy = false;

try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); msgs = s.msgs || []; solution = !!s.solution; } catch {}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ msgs, solution })); } catch {} }

function bubble(cls, text) {
  const d = document.createElement("div");
  d.className = "m " + cls; d.textContent = text; log.appendChild(d);
  log.scrollTop = log.scrollHeight; return d;
}
function render() {
  log.innerHTML = "";
  modeBtn.setAttribute("aria-pressed", solution);
  if (!msgs.length) {
    const s = document.createElement("div"); s.id = "start";
    s.innerHTML = "<h2>नमस्ते, मैं सारथी हूँ</h2><div>Ask in Hindi, English or Hinglish.</div><div class='chips'></div>";
    ["मेरा फोन बहुत स्लो चल रहा है, क्या करूँ?", "Resume me kya likhna chahiye?", "Explain EMI in simple words"].forEach((q) => {
      const b = document.createElement("button"); b.textContent = q; b.type = "button";
      b.onclick = () => submit(q); s.querySelector(".chips").appendChild(b);
    });
    log.appendChild(s); return;
  }
  msgs.forEach((m) => bubble(m.role === "user" ? "user" : "bot", m.text));
}
function showError(text) {
  const d = bubble("err", text + " ");
  const r = document.createElement("button"); r.textContent = "Retry"; r.type = "button";
  r.onclick = () => { d.remove(); ask(); }; d.appendChild(r);
}
async function ask() {
  busy = true; send.disabled = true;
  const wait = bubble("bot dots", "Soch raha hoon…");
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: msgs, solution }) });
    const data = await res.json().catch(() => ({}));
    wait.remove();
    if (!res.ok || !data.reply) { showError(data.error || "Something went wrong. Check your connection."); }
    else { msgs.push({ role: "model", text: data.reply }); save(); bubble("bot", data.reply); }
  } catch { wait.remove(); showError("No internet or server unreachable."); }
  busy = false; send.disabled = false; t.focus();
}
function submit(text) {
  text = text.trim(); if (!text || busy) return;
  if (!msgs.length) log.innerHTML = "";
  msgs.push({ role: "user", text }); save(); bubble("user", text); ask();
}
$("f").onsubmit = (e) => { e.preventDefault(); const v = t.value; t.value = ""; t.style.height = "auto"; submit(v); };
t.oninput = () => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };
t.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches) { e.preventDefault(); $("f").requestSubmit(); } };
modeBtn.onclick = () => { solution = !solution; save(); modeBtn.setAttribute("aria-pressed", solution); };
$("new").onclick = () => { if (busy) return; msgs = []; save(); render(); };
render();
</script>
</body>
</html>
